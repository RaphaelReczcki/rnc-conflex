# PostgreSQL local para desenvolvimento (opcional: o padrão do projeto é o Neon).
# Uso: docker compose up -d   (lê POSTGRES_PASSWORD do .env)
services:
  db:
    image: postgres:17-alpine
    container_name: rnc-conflex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rnc
      POSTGRES_USER: rnc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - rnc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rnc -d rnc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rnc-db:
